name: Python integrity checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime smoke dependency
        run: python -m pip install "PySide6>=6.8,<7"
      - name: Compile Python sources
        run: python -m compileall -q english_player main.py
      - name: Run tests including Qt startup smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 45s python -m unittest discover -s tests -v
